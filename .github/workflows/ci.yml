name: Scientific core
on:
  push:
  pull_request:
  workflow_dispatch:
# Least-privilege; no deployment, tags or package publishing from pull requests.
permissions:
  contents: read
concurrency:
  group: scientific-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned v7.1.0 (Node 24)
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]" "ruff>=0.12,<1"
      - name: Static syntax and correctness lint (narrow rules)
        run: |
          python -m compileall -q src scripts tests
          python -m ruff check --select E4,E7,E9,F63,F7,F82 src scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Recreate synthetic benchmark ledger
        run: python scripts/run_foundation_benchmark.py
      - name: Verify ten independent analytical self-test references
        run: python scripts/run_analytical_catalog.py
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Test clean, isolated wheel and sdist installs
        run: python scripts/verify_distributions.py
      - name: Audit source and distributions; record SHA-256 manifest
        run: python scripts/audit_release_artifacts.py
      - name: Validate PyPI metadata and CFF author citation (Python 3.10 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m pip install "twine>=6,<8" "cffconvert>=2,<3"
          python -m twine check dist/*.whl dist/*.tar.gz
          cffconvert --validate -i CITATION.cff
      - name: Upload audited build and run-specific manifest (14 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned v7.0.2 (Node 24)
        with:
          name: enerlint-build-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            artifacts/ci/build-manifest.json
            artifacts/ci/analytical_catalog_v0.1.json
          if-no-files-found: error
          retention-days: 14
      - name: Review declared compressor physical boundary (author attestation only)
        run: >
          python scripts/review_control_volume.py
          examples/steady_compressor.json
          examples/steady_compressor.boundary-review.json
      - name: Check nonadiabatic control-volume example
        run: python -m enerlint check examples/steady_nonadiabatic_compressor.json
      - name: Review property-reference declarations (author attestation only)
        run: |
          python scripts/review_property_references.py examples/steady_compressor.json examples/steady_compressor.property-review.json
          python scripts/review_property_references.py examples/steady_heat_exchanger.json examples/steady_heat_exchanger.property-review.json
      - name: Check demonstrator cases
        shell: bash
        run: |
          python -m enerlint check examples/steady_compressor.json
          python -m enerlint check examples/steady_heat_exchanger.json
          python -m enerlint check examples/steady_turbine.json
          python -m enerlint check examples/storage_interval.json
