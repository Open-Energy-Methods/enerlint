name: Scientific core
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Recreate synthetic benchmark ledger
        run: python scripts/run_foundation_benchmark.py
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Test clean, isolated wheel and sdist installs
        run: python scripts/verify_distributions.py
      - name: Review declared compressor physical boundary (author attestation only)
        run: >
          python scripts/review_control_volume.py
          examples/steady_compressor.json
          examples/steady_compressor.boundary-review.json
      - name: Check nonadiabatic control-volume example
        run: python -m enerlint check examples/steady_nonadiabatic_compressor.json
      - name: Check demonstrator cases
        shell: bash
        run: |
          python -m enerlint check examples/steady_compressor.json
          python -m enerlint check examples/steady_heat_exchanger.json
          python -m enerlint check examples/steady_turbine.json
          python -m enerlint check examples/storage_interval.json
