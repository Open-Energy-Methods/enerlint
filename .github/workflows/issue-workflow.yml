name: Keep research tickets in a coherent Agile status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-workflow.yml
  issues:
    types: [opened, labeled, reopened, closed]
permissions:
  contents: read
  issues: write
concurrency:
  group: agile-status-${{ github.repository }}-${{ github.event.issue.number || 'bulk' }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure one status label and Agile ticket kind per issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json",
          "X-GitHub-Api-Version":"2022-11-28","User-Agent":"OEM-agile-workflow"}
          def api(method, path, payload=None):
              url = f"https://api.github.com/repos/{repo}/{path}"
              body = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url,data=body,headers=headers,method=method)
              if body is not None: req.add_header("Content-Type","application/json")
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      raw=resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail=exc.read().decode(errors="replace")
                  raise RuntimeError(f"GitHub API {exc.code} for {method} {path}: {detail[:350]}") from exc
          def standardize(issue, preferred=None):
              if "pull_request" in issue: return 0
              names={x["name"] for x in issue.get("labels",[])}
              statuses=sorted(x for x in names if x.startswith("workflow:"))
              if preferred is None:
                  preferred=statuses[0] if statuses else "workflow:backlog"
              if preferred not in names:
                  api("POST",f"issues/{issue['number']}/labels",{"labels":[preferred]})
              for label in statuses:
                  if label!=preferred:
                      api("DELETE",f"issues/{issue['number']}/labels/"+urllib.parse.quote(label,safe=""))
              if not any(x.startswith("agile:") for x in names):
                  api("POST",f"issues/{issue['number']}/labels",{"labels":["agile:task"]})
              return 1
          with open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8") as f: event=json.load(f)
          event_name=os.environ.get("GITHUB_EVENT_NAME")
          if event_name=="issues":
              issue=event.get("issue") or {}
              action=event.get("action")
              if issue:
                  if action=="closed":
                      closed_reason=issue.get("state_reason")
                      status="workflow:wont-do" if closed_reason=="not_planned" else "workflow:done"
                      standardize(issue,status)
                  elif action=="reopened":
                      standardize(issue,"workflow:backlog")
                  elif action=="labeled":
                      added=(event.get("label") or {}).get("name","")
                      if added.startswith("workflow:"): standardize(issue,added)
                  elif action=="opened":
                      standardize(issue)
          else:
              count=0
              for page in range(1,10):
                  issues=api("GET",f"issues?state=open&per_page=100&page={page}")
                  for issue in issues: count+=standardize(issue)
                  if len(issues)<100: break
              print(f"Initialized or validated Agile status and ticket kind for {count} open issues.")
          
          PY
